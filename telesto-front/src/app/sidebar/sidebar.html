<div class="layout">
    <section class="sidebar" [class.expanded]="expanded">
        <div class="sidebar-header">
            <a href="#" class="sidebar-logo">
                <img src="/logoTelesto.png" alt="brand`s logo">
                @if (expanded) {
                <h3>
                    Telesto
                </h3>
                }
            </a>
            <div class="sidebar-expand-btn">
                <button (click)="toggle()">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="128" height="128">
                        <path fill="#292929"
                            d="M12.5 8v8l4-4zM5 21q-.825 0-1.412-.587T3 19V5q0-.825.588-1.412T5 3h14q.825 0 1.413.588T21 5v14q0 .825-.587 1.413T19 21zm3-2V5H5v14zm2 0h9V5h-9zm-2 0H5z" />
                    </svg>
                </button>
            </div>
        </div>

        <div class="sidebar-menu">
            <ul>
                @for(item of menuItems; track item.text) {
                <li class="sidebar-menu-item">
                    <a class="sidebar-menu-link" [routerLink]="item.route" routerLinkActive="active">
                        <span class="material-icons">{{item.icon}}</span>
                        <span class="sidebar-item-text">{{item.text}}</span>
                    </a>
                </li>
                }
            </ul>
        </div>
    </section>
    <div class="content">
        <ng-content></ng-content>
    </div>
</div>
